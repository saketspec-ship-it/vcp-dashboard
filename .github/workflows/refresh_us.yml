name: Refresh US VCP scan

on:
  repository_dispatch:
    types: [refresh_us]
  workflow_dispatch: {}
  schedule:
    - cron: "0 13 * * 1-5"   # ~08:00 ET pre-open (weekdays)
    - cron: "30 20 * * 1-5"  # ~15:30 ET / after close (weekdays)

concurrency:
  group: vcp-refresh-us
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run US scan (cooldown-protected)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python us_scan.py

      - name: Commit and push US dashboard
        run: |
          git config user.email "vcp-dashboard-bot@users.noreply.github.com"
          git config user.name "VCP Dashboard Bot"
          git add us .nojekyll
          git diff --staged --quiet && echo "Nothing to commit (cooldown skip or no changes)" && exit 0
          git commit -m "US VCP dashboard refresh (Actions) $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push

      - name: Trigger Pages rebuild
        if: success()
        continue-on-error: true
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
